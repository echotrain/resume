name: Resume site

# A push or pull request that only touches these paths cannot change the site,
# so it does not run the workflow. A change that also touches any other file
# runs it as usual, and "Run workflow" in the Actions tab always works.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CLAUDE.md
      - AGENTS.md
      - .claude/**
  pull_request:
    paths-ignore:
      - README.md
      - CLAUDE.md
      - AGENTS.md
      - .claude/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}

      - run: mix deps.get

      - name: Format, lint and test
        run: mix check

      # The resume page, then the easter egg's Elixir runtime for the browser.
      # Pages cannot negotiate the pre-compressed .br/.gz copies, so drop them.
      - name: Build the site
        run: |
          mix site.build
          find output/game/out -type f \( -name '*.br' -o -name '*.gz' \) -delete
          du -sh output output/game/out
        env:
          MIX_ENV: prod

      - name: Check the printed resume fits on two pages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf=resume.pdf "file://$PWD/output/index.html"
          pages=$(pdfinfo resume.pdf | awk '/^Pages:/ {print $2}')
          echo "Printed resume is $pages page(s)"
          test "$pages" -le 2

      - name: Keep the printed PDF for inspection
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdf
          path: resume.pdf

      - uses: actions/upload-pages-artifact@v5
        with:
          path: output

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
